<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>NoteVault — Shared Notes</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">📝</span>
          <span class="logo-text">NoteVault</span>
        </div>
        <button id="newNoteBtn" class="btn btn-primary btn-icon hidden" title="New Note">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search notes..." autocomplete="off" />
      </div>

      <!-- Folders -->
      <div class="folders-section">
        <div class="folders-header">
          <span>Folders</span>
          <button id="newFolderBtn" class="btn btn-ghost btn-xs hidden" title="New Folder">+</button>
        </div>
        <div class="folders-list" id="foldersList">
          <div class="folder-item active" data-folder="all">
            <span class="folder-icon">📂</span>
            <span class="folder-name">All Notes</span>
          </div>
        </div>
      </div>

      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="pinned">Pinned</button>
        <button class="filter-tab" data-filter="recent">Recent</button>
      </div>

      <div class="notes-list" id="notesList">
        <div class="loading-state">Loading notes...</div>
      </div>

      <div class="sidebar-footer">
        <button id="themeToggle" class="btn btn-ghost" title="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <span class="note-count" id="noteCount">—</span>
        <button id="authBtn" class="btn btn-ghost" title="Editor login">Login</button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">📓</div>
        <h2>No note selected</h2>
        <p>Select a note from the sidebar to view it.</p>
        <p class="read-only-hint" id="readOnlyHint">You are in <strong>read-only</strong> mode. Only the owner can edit.</p>
      </div>

      <div id="editorView" class="editor-view hidden">
        <div class="editor-toolbar">
          <div class="toolbar-left">
            <input type="text" id="noteTitle" class="title-input" placeholder="Untitled note" readonly />
            <div class="meta-row">
              <input type="text" id="noteTags" class="tags-input" placeholder="Tags" readonly />
              <select id="noteFolder" class="folder-select" disabled>
                <option value="">No folder</option>
              </select>
              <span class="updated-at" id="updatedAt"></span>
            </div>
          </div>
          <div class="toolbar-right">
            <button id="pinBtn" class="btn btn-ghost hidden" title="Pin note">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
            </button>
            <button id="previewBtn" class="btn btn-ghost" title="Toggle preview">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button id="deleteBtn" class="btn btn-danger-ghost hidden" title="Delete note">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </div>

        <!-- PDF Section -->
        <div id="pdfSection" class="pdf-section">
          <div id="pdfDisplay" class="pdf-display hidden">
            <div class="pdf-info">
              <span class="pdf-icon">📄</span>
              <span id="pdfName" class="pdf-name"></span>
            </div>
            <div class="pdf-actions">
              <a id="pdfViewBtn" href="#" target="_blank" class="btn btn-primary btn-sm">View PDF</a>
              <button id="pdfRemoveBtn" class="btn btn-danger-ghost btn-sm hidden" title="Remove PDF">Remove</button>
            </div>
          </div>
          <div id="pdfUploadArea" class="pdf-upload-area hidden">
            <label class="pdf-upload-label">
              <input type="file" id="pdfInput" accept=".pdf,application/pdf" hidden />
              <span>📎 Attach PDF</span>
            </label>
            <span id="pdfUploading" class="pdf-uploading hidden">Uploading...</span>
          </div>
        </div>

        <div class="editor-body">
          <textarea id="noteContent" class="content-area" placeholder="Start writing..." readonly></textarea>
          <div id="previewArea" class="preview-area hidden"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Password Modal -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <h3>Editor Access</h3>
      <p>Enter the password to edit notes.</p>
      <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password" />
      <div class="modal-actions">
        <button id="cancelAuthBtn" class="btn btn-ghost">Cancel</button>
        <button id="submitAuthBtn" class="btn btn-primary">Unlock</button>
      </div>
      <p id="authError" class="auth-error hidden">Wrong password</p>
    </div>
  </div>

  <!-- New Folder Modal -->
  <div id="folderModal" class="modal hidden">
    <div class="modal-content">
      <h3 id="folderModalTitle">New Folder</h3>
      <input type="text" id="folderNameInput" placeholder="Folder name (e.g. Math, Physics)" maxlength="40" />
      <div class="modal-actions">
        <button id="cancelFolderBtn" class="btn btn-ghost">Cancel</button>
        <button id="submitFolderBtn" class="btn btn-primary">Create</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
